<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14324a">
  <title>GPS Site Survey</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Projects -->
  <section id="view-projects" class="view">
    <header class="bar"><h1>GPS Site Survey</h1></header>
    <div class="scroll pad">
      <button id="btn-new-project" class="btn primary big">+ New survey</button>
      <div id="project-list"></div>
      <div class="muted small center gap-top">
        Surveys are saved on this phone. Use Export → Backup to keep a copy.
      </div>
      <button id="btn-restore" class="btn ghost gap-top">Restore from backup file</button>
      <input id="file-restore" type="file" accept=".json,application/json" hidden>
    </div>
  </section>

  <!-- Project setup -->
  <section id="view-setup" class="view" hidden>
    <header class="bar">
      <button class="icon-btn" id="setup-back" aria-label="Back">‹</button>
      <h1 id="setup-title">New survey</h1>
    </header>
    <div class="scroll pad">
      <label class="field">Survey name
        <input id="setup-name" type="text" placeholder="e.g. Ocean County Mall, exterior" autocomplete="off">
      </label>

      <div class="field">Fixture and pole styles for this site
        <div class="row">
          <input id="setup-style-input" type="text" placeholder="e.g. Shoebox head" autocomplete="off">
          <button id="setup-style-add" class="btn">Add</button>
        </div>
        <div id="setup-styles" class="chips"></div>
        <div class="muted small">You can add more styles during the survey.</div>
      </div>

      <div class="field">Lots or zones (optional)
        <div class="row">
          <input id="setup-lot-input" type="text" placeholder="e.g. Lot A, North lot" autocomplete="off">
          <button id="setup-lot-add" class="btn">Add</button>
        </div>
        <div id="setup-lots" class="chips"></div>
      </div>

      <button id="setup-save" class="btn primary big gap-top">Start surveying</button>
      <button id="setup-delete" class="btn danger gap-top" hidden>Delete this survey</button>
    </div>
  </section>

  <!-- Survey -->
  <section id="view-survey" class="view" hidden>
    <header class="bar">
      <button class="icon-btn" id="survey-back" aria-label="Back to surveys">‹</button>
      <h1 id="survey-title"></h1>
      <button class="icon-btn" id="survey-menu" aria-label="Menu">☰</button>
    </header>
    <div id="map"></div>
    <div class="status">
      <span id="gps-status" class="gps bad">Waiting for GPS…</span>
      <button id="lot-chip" class="chip lot"></button>
      <span id="pin-count" class="muted"></span>
    </div>
    <div class="pin-wrap">
      <button id="btn-pin" class="pin-btn" disabled>
        <span class="pin-label">PIN HERE</span>
        <span id="pin-sub" class="pin-sub">waiting for GPS</span>
      </button>
    </div>
    <div id="move-bar" class="move-bar" hidden>
      <span>Drag the pin to the right spot</span>
      <button id="move-cancel" class="btn">Cancel</button>
      <button id="move-done" class="btn primary">Done</button>
    </div>
  </section>

  <!-- Sheets and dialogs -->
  <div id="scrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" hidden></section>
  <div id="dialog" class="dialog" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <input id="file-photos" type="file" accept="image/*" multiple hidden>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
